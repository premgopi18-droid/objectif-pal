# Backups hebdomadaires chiffrés (issue #189, epic #182 — Phase 1).
#
# Le plan Supabase Free n'a AUCUN backup automatique : ce workflow est le seul
# filet contre une fausse manip SQL ou un bug d'écriture. Contrainte 0 €/mois
# (14/08/2026) : artifacts GitHub (repo privé), rétention 90 jours ≈ 13 points
# de restauration glissants.
#
# Ce qui est sauvegardé : schémas `public` + `auth` (comptes compris), SANS
# les données GCD (`gcd_issues`/`gcd_series` se régénèrent depuis le dump
# comics.org en ~3 min — les inclure serait ~40 Mo de bruit par semaine).
# ⚠️ Les FICHIERS Storage (photos maison) ne sont pas couverts — seulement
# leurs métadonnées. Acceptable au volume actuel ; à re-peser avec le chantier
# cycle de vie storage.
#
# Secrets requis (posés le 15/08/2026) :
#   SUPABASE_DB_URL    — connexion via le pooler SESSION (port 5432, IPv4 :
#                        les runners GitHub n'ont pas d'IPv6, la connexion
#                        directe db.*.supabase.co est IPv6-only)
#   BACKUP_PASSPHRASE  — chiffrement AES-256 ; copie locale dans .env.local.
#                        ⚠️ SANS ELLE, LES DUMPS SONT ILLISIBLES.
#
# ── Restauration (documentée ici, testée à la mise en place) ────────────────
#   1. Télécharger l'artifact backup-YYYY-MM-DD, puis :
#        openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#          -in backup.dump.enc -out backup.dump -pass env:BACKUP_PASSPHRASE
#   2. Restaurer (base cible : projet Supabase neuf ou existant) :
#        pg_restore --no-owner --no-privileges --clean --if-exists \
#          -d "$SUPABASE_DB_URL" backup.dump
#   3. Recharger GCD : scripts/gcd-load.mjs depuis le dump comics.org,
#      puis `npm run db:types` si le schéma a bougé.
name: Backup

on:
  schedule:
    # Tous les lundis à 04:00 UTC — avant toute activité de la semaine.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # pg_dump doit être >= à la version du serveur (Postgres 17) — le
      # client des runners est en retard, on prend celui du dépôt PGDG.
      # Pattern signed-by (review #190) : apt-key n'existe plus sur Ubuntu 24.04.
      - name: Installer le client Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      # La date dans le nom d'artifact (review #190) : au moment de restaurer
      # sous stress, on cherche une date, pas un run_id.
      - name: Dater le backup
        id: date
        run: echo "today=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Dump chiffré
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --exclude-table-data='public.gcd_issues' \
            --exclude-table-data='public.gcd_series' \
            --file=backup.dump
          # Garde-fou : un dump anormalement petit est un dump raté — mieux
          # vaut un workflow rouge qu'un faux sentiment de sécurité.
          test "$(stat -c%s backup.dump)" -gt 100000
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.dump -out backup.dump.enc -pass env:BACKUP_PASSPHRASE
          rm backup.dump

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ steps.date.outputs.today }}-${{ github.run_id }}
          path: backup.dump.enc
          retention-days: 90
          if-no-files-found: error
